<app-card>
  <div card-header>Shipment</div>
  <div card-body>
    <div class="shipment-details">
      <p>Shipment ID: {{shipmentDetails.shipmentId}}</p>
      <p>Status: {{shipmentDetails.status}}</p>
      <p>Load Plan: {{shipmentDetails.loadPlan}}</p>
       @for(instance of shipmentDetails.shipmentInstances; track instance.instanceId) {
        <app-shipment-instance [instance]="instance"></app-shipment-instance>
       }
    </div>
  </div>
</app-card>
