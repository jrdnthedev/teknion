<main>
  <aside>
    <ul id="po-listItems">
      @for(order of (purchaseOrder$ | async); track order.poId) {
      <li>
        <a [routerLink]="'purchase-order-detail/' + order.poId">{{ order.poId }}</a>
      </li>
      }
    </ul>
  </aside>
  <section>
    @if (showWelcome()) {
    <div id="welcome-headline">
      <h2>Welcome To Purchase Order Application</h2>
      <p>Select an order to begin</p>
    </div>
    }
    <router-outlet></router-outlet>
  </section>
</main>
