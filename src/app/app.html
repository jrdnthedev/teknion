<main>
  <section>
    <select
      name="orderLines"
      id="orderLines"
      #orderSelect
      (change)="filterOrderLines(orderSelect.value)"
    >
      <option value="All">All</option>
      @for(order of purchaseOrder.orderLines; track order.lineId) {
      <option [value]="order.lineId">{{ order.lineId }}</option>
      }
    </select>

    <app-table [data]="filteredOrderLines" tableTitle="Order Lines Table"></app-table>
  </section>
  <aside>
    <app-po-detail [order]="purchaseOrder"></app-po-detail>
    <app-shipments-list [shipment]="purchaseOrder.shipments"></app-shipments-list>
  </aside>
</main>
