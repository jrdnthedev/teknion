<nav>
  <!-- Mobile menu button -->
  <button
    id="mobile-menu-btn"
    (click)="toggleMenu()"
    [attr.aria-expanded]="isMenuOpen()"
    aria-label="Toggle navigation menu"
  >
    <span class="hamburger-line"></span>
    <span class="hamburger-line"></span>
    <span class="hamburger-line"></span>
  </button>
  <ul id="po-listItems" [class.nav-menu-open]="isMenuOpen()">
    @for(order of navItems; track order.poId) {
    <li>
      <a [routerLink]="'purchase-order-detail/' + order.poId" (click)="closeMenu()">{{ order.poId }}</a>
    </li>
    }
  </ul>
</nav>
